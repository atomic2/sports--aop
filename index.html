<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Chasers - Brightened Hero Edit</title>
    <style>
        /* CSS Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }

        body {
            background-color: #000000; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Mobile App Screen Container */
        .app-container {
            width: 100%;
            max-width: 400px; 
            height: 850px;
            max-height: 100vh;
            /* Lighter charcoal background for the overall container */
            background-color: #2a2a2a;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 50px rgba(255, 102, 0, 0.3);
            border-radius: 24px;
            border: 2px solid #442211;
            overflow: hidden;
        }

        /* The Background Image Area */
        .hero-space {
    flex: 1;
    width: 100%;
    min-height: 50%;
    /* Add the folder name and a forward slash before the file name */
    background-image: url('images/sports-montage.jpg'); 
    background-size: cover;
    background-position: center top;
    position: relative;
    z-index: 1;
}

        /* Blends the image seamlessly into the new charcoal background */
        .hero-space::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: linear-gradient(to bottom, rgba(42, 42, 42, 0) 0%, rgba(42, 42, 42, 1) 100%);
        }

        /* Form Content Area - Now Charcoal Gray */
        .content {
            padding: 0 30px 40px 30px;
            display: flex;
            flex-direction: column;
            z-index: 10;
            background-color: #2a2a2a;
        }

        /* Massive Metallic Block Logo */
        .logo-text {
            font-size: 3.8rem;
            line-height: 0.85;
            text-align: center;
            text-transform: uppercase;
            font-style: italic;
            margin-bottom: 30px;
            margin-top: -20px; 
            background: linear-gradient(to bottom, #ffffff 0%, #cccccc 40%, #888888 50%, #eeeeee 60%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(3px 3px 0px #111) drop-shadow(0px 0px 15px rgba(255, 102, 0, 0.5));
            transform: scaleY(1.1);
        }

        .logo-text span {
            font-size: 4.2rem;
            display: block;
            background: linear-gradient(to bottom, #ff9900 0%, #ff3300 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Brightened Form Inputs */
        .input-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }

        .input-group input {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #333333; /* Lighter box color */
            border: 2px solid #ff6600; /* Full orange border */
            border-radius: 4px;
            padding: 18px 16px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.5), 0 0 8px rgba(255, 102, 0, 0.15);
        }

        .input-group input:focus {
            background-color: #444444;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.5), 0 0 15px rgba(255, 102, 0, 0.5);
        }

        .input-group input::placeholder {
            color: #ffaa77; /* Brighter, readable orange placeholder */
            font-style: italic;
            font-weight: normal;
        }

        /* High Energy Button */
        .btn-login {
            width: 100%;
            padding: 18px;
            margin-top: 15px;
            background: linear-gradient(to right, #ff3300, #ff9900);
            border: none;
            color: #000000;
            font-size: 1.4rem;
            font-style: italic;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 102, 0, 0.5);
            transition: all 0.1s ease;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%); 
        }

        .btn-login:hover {
            background: linear-gradient(to right, #ff4411, #ffaa11);
            transform: scale(1.02);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        /* Clean Links */
        .footer-links {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .footer-links a {
            color: #ffffff; /* Brighter white links */
            font-size: 0.85rem;
            font-weight: 800;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: #ffcc00;
        }
        
        .accent-link {
            color: #ff6600 !important;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- The Background Image Area -->
        <div class="hero-space"></div>

        <main class="content">
            <!-- Massive Block Poster Text -->
            <div class="logo-text">CARD<span>CHASERS</span></div>

            <form onsubmit="event.preventDefault();">
                <div class="input-group">
                    <input type="text" placeholder="USERNAME // ID">
                </div>

                <div class="input-group">
                    <input type="password" placeholder="SECURITY CODE">
                </div>

                <button type="submit" class="btn-login">ENTER THE HUNT</button>
            </form>

            <div class="footer-links">
                <a href="#">RECOVER LOG</a>
                <a href="#" class="accent-link">NEW RECRUIT?</a>
            </div>
        </main>

    </div>

</body>
</html>
